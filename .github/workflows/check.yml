name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  architecture-and-tests:
    # Blacksmith runners; the Blacksmith GitHub App must be installed on this repository.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native font libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev
      - run: npm ci
      - run: npm run build:native
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
