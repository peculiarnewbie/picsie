name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  architecture-and-tests:
    # Namespace runner profile; the Namespace GitHub App must be installed on this repository.
    runs-on: namespace-profile-peculiarnewbie
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native font libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev
      - run: npm ci
      - run: npm run build:native
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
  desktop-ui:
    runs-on: namespace-profile-peculiarnewbie
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/picsie-desktop
      - name: Install desktop build and verification dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential clang pkg-config libssl-dev libfontconfig-dev libfreetype-dev
          libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev mesa-vulkan-drivers xvfb xdotool imagemagick dbus-x11
          xdg-desktop-portal xdg-desktop-portal-gtk
      - run: node scripts/check-architecture.mjs
      - run: cargo fmt --manifest-path crates/picsie-desktop/Cargo.toml --check
      - run: cargo test --locked --manifest-path crates/picsie-desktop/Cargo.toml
      - run: cargo build --locked --release --manifest-path crates/picsie-desktop/Cargo.toml
      - run: python3 crates/picsie-desktop/verify.py --software
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-ui-verification
          path: artifacts/gpui-parity/verification/
          if-no-files-found: ignore
