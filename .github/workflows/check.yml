name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  architecture-and-tests:
    # Namespace runner profile; the Namespace GitHub App must be installed on this repository.
    runs-on: namespace-profile-peculiarnewbie
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native font libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev
      - run: npm ci
      - run: npm run build:native
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
