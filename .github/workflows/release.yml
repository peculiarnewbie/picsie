name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Namespace runner profile; the Namespace GitHub App must be installed on this repository.
          - target: linux-x64
            runner: namespace-profile-peculiarnewbie
          # Namespace profiles are bound to one OS. Create a Windows profile in the Namespace
          # dashboard and swap this label to use it here too.
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/picsie-desktop
          cache-all-crates: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential clang pkg-config libssl-dev libfontconfig-dev libfreetype-dev
          libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Require the tag to match package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run build:native
      - run: npm run check
      - run: npm test
      - run: npm run test:bun
      - run: npm run setup:packager
      - run: npm run build
      - run: python scripts/verify-desktop-package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: picsie-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: picsie-*
          path: dist/release
          merge-multiple: true
      - run: node scripts/release-notes.mjs
      - name: Upload native packages to a draft release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
              echo "Refusing to overwrite a published release" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file artifacts/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Picsie $GITHUB_REF_NAME" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
